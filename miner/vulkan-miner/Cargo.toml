[package]
name = "vulkan-miner"
version = "0.1.0"
edition = "2021"

[dependencies]
vulkan-wrappers = { path = "../vulkan-wrappers" }
bytemuck = "1"
blake3 = "1.8"
pearl-blake3 = { path = "../../pearl-blake3" }
zk-pow = { path = "../../zk-pow" }
tokio = { version = "1", features = ["full"] }
bincode = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
base64 = "0.21"
hex = "0.4"
serde_json = "1"
