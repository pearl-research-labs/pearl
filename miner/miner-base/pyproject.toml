[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "pylsp-mypy>=0.7.0",
  "pytest-asyncio>=1.2.0",
  "pytest-randomly>=4.0.1",
  "pytest-rerunfailures>=16.0.1",
  "pytest-xdist>=3.8.0",
  "pytest>=8.3.0",
  "python-lsp-ruff>=2.2.2",
  "python-lsp-server>=1.13.1",
  "ruff>=0.13.2"
]

[project]
name = "miner-base"
version = "0.1.0"
description = "Shared protocol, gateway, accounting, and submission primitives"
readme = "README.md"
authors = [
  {name = "Daniel Raskin", email = "daniel.raskin@pearlresearch.ai"},
  {name = "Matan Peled", email = "matan.peled@pearlresearch.ai"}
]
requires-python = "==3.12.*"
dependencies = [
  "blake3>=1.0.7",
  "loguru>=0.7.3",
  "miner-utils",
  "numpy>=2.2.6",
  "pearl-blake3",
  "pearl-gateway",
  "py-pearl-mining",
  "pydantic-settings>=2.8.1",
  "torch>=2.13,<2.14"
]

