# Drop-in for prometheus.yml — scrape the solo pool's /metrics endpoint.
# Edit the `targets` to point at wherever pearl-stratum-srv is running.

scrape_configs:
  - job_name: pearl-stratum-srv
    scrape_interval: 15s
    scrape_timeout: 5s
    metrics_path: /metrics
    static_configs:
      - targets:
          - cpu02.lan:9101    # primary pool host
          # - cpu01.lan:9101  # uncomment if you bring up a standby
        labels:
          pool: solo-cpu02

