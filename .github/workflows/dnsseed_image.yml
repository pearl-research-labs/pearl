name: DNS Seeder / Build & Publish

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-End Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Run seeder end-to-end test
        run: go test -tags e2e -v -timeout 10m -count=1 ./coredns-dnsseed/integration

  docker:
    needs: e2e
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: docker/github-builder/.github/workflows/build.yml@v1
    with:
      output: image
      context: .
      file: ./coredns-dnsseed/deploy/Dockerfile
      platforms: linux/amd64,linux/arm64
      push: true
      cache: true
      cache-mode: max
      sbom: true
      set-meta-labels: true
      set-meta-annotations: true
      meta-images: ghcr.io/${{ github.repository }}/pearl-seeder
      meta-tags: |
        type=sha
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
