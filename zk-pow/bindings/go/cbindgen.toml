# cbindgen configuration for zk_pow_ffi

language = "C"

[defines]
# No special defines needed

[export]
# Include these items in the generated header
include = [
    "IncompleteBlockHeader",
    "MiningConfiguration",
    "CMatrixMerkleProof",
    "CPlainProof",
    "CZKProof",
    "PUBLICDATA_SIZE",
    "PUBLICDATA_MAX_SIZE",
    "V4_PUBLIC_PARAMS_WIRE_SIZE",
    "V4_BLOCK_HEADER_SERIALIZED_SIZE",
    "V4_MOE_PARAMS_MAX_NUM_EXPERTS",
    "V4_AXIS_PATTERN_NUM_DIMS",
]

[export.rename]
# Preserve the constant names emitted before version modules were separated.
V4_PUBLIC_PARAMS_WIRE_SIZE = "PublicParams_WIRE_SIZE"
V4_BLOCK_HEADER_SERIALIZED_SIZE = "BlockHeader_SERIALIZED_SIZE"
V4_MOE_PARAMS_MAX_NUM_EXPERTS = "MoeParams_MAX_NUM_EXPERTS"
V4_AXIS_PATTERN_NUM_DIMS = "AxisPattern_NUM_DIMS"

[parse]
# Parse dependencies to find types
parse_deps = true
include = ["zk-pow"]

[enum]
# Use plain integers for enums in C
rename_variants = "None"
