[project]
name = "Pearl"
version = "0.1.0"
description = "Pearl monorepo workspace"
requires-python = "==3.12.*"

# No PEP 658 sidecar, so declare metadata statically; keep in sync with miner/vllm-miner.
[[tool.uv.dependency-metadata]]
name = "flashinfer-cubin"
version = "0.6.16.post3"
requires-dist = []

# PyTorch cu130 index — PyPI default torch 2.13 wheels are also CUDA 13, but
# routing through this index pins torch/torchaudio/torchvision to the explicit
# +cu130 local-version wheels for clarity and consistency.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# vLLM's Linux flashinfer cubin is distributed from the official project
# index rather than PyPI.
[[tool.uv.index]]
name = "flashinfer"
url = "https://flashinfer.ai/whl"
explicit = true

# Workspace sources. Route torch/torchaudio/torchvision through the cu130
# index so all three resolve to the +cu130 local-version wheels and stay
# aligned with the CUDA 13 toolchain.
[tool.uv.sources]
flashinfer-cubin = { index = "flashinfer" }
torch = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
pearl-blake3 = {path = "pearl-blake3"}
py-pearl-mining = {workspace = true}
miner-utils = {workspace = true}
pearl-gateway = {workspace = true}
miner-base = {workspace = true}
vllm-miner = {workspace = true}
pearl-gemm = {workspace = true}

# pytest config for every test tree except miner/pearl-gemm/, which ships
# its own pytest.ini (pytest picks the nearest one).
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["miner", "miner/vllm-miner/tests"]
markers = [
    "integration: marks tests as integration tests (may require external services)",
    "schema: marks tests as schema validation tests",
    "https: marks tests as HTTPS/TLS connectivity tests",
    "performance: marks tests as performance tests (throughput, latency, memory)",
    "slow: marks tests as slow running tests (typically >30 seconds)",
    "gpu: marks tests that require a CUDA GPU",
    "moe: marks Mixture-of-Experts (MoE) mining tests",
]
python_files = ["test_*.py", "*_test.py"]
norecursedirs = [".git", ".venv", "venv", ".github", ".pytest_cache", ".mypy_cache", ".ruff_cache", "build", "dist", "third_party"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --import-mode=importlib"

[tool.uv.workspace]
members = [
  "py-pearl-mining",
  "miner/miner-utils",
  "miner/pearl-gateway",
  "miner/miner-base",
  "miner/vllm-miner",
  "miner/pearl-gemm",
]
